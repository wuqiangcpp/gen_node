<!DOCTYPE html>
<html lang="en" data-kantu="1"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>
      showgraph
    </title>
  <head>
    <style type="text/css">
      html,
      body,
      #mynetwork {
          margin: 0px;
          padding: 0px;
	  height: 100%;
	  width: 100%;	  
      }

      #mynetwork {
          /* position: fixed; */
          left: 0px;
          top: 0px;
          bottom: 0px;
          border-right: 1px solid lightgray;
          background: white;
      }


      #title {
          margin-bottom: 5em;
      }
      .connected {
	  color: green;
      }

      .disconnected {
	  color: lightgray;
      }      
    </style>
    <script type="text/javascript" src="./js/vis-network.min.js"></script>
  </head>

  <body>
    <div id="connection" class="disconnected">&#9679;</div>
    <div id="show" style="text-align:center"></div>    
    <div id="mynetwork"></div>
    <script type="text/javascript">
      var ws;
      function getRelations() {
	  ws.send(JSON.stringify({cmd: "get"}));
      }
      var container = document.getElementById("mynetwork");
      var options = {};
      var network= new vis.Network(container,{}, options);
      var nodes = new vis.DataSet();
      var edges = new vis.DataSet();
      network.setData({nodes: nodes, edges: edges});

      function enable_physics_once() {
          network.setOptions({physics: {enabled: true}});
          network.once("stabilized", function() {
              network.setOptions({physics: {enabled: false}});
          });
      }

      function update_nodes_from_data(dataJson) {
          var positions = network.getPositions();
          var existingIds = Object.keys(positions);
          var currentIds = dataJson.nodes.map(function(n) { return n.id; });

          if (currentIds.some(function(id) { return existingIds.indexOf(id) === -1; })) {
              enable_physics_once();
          }

          dataJson.nodes.forEach(function(n){
              var pos = positions[n.id] || {};
              nodes.update({id: n.id, label: n.id, x: pos.x, y: pos.y, color: "#D2E5FF"});
          });

          nodes.forEach(function(n) {
              if (currentIds.indexOf(n.id) === -1) nodes.remove(n.id);
          });
      }

      function update_edges_from_data(dataJson) {
          var linkIds = {};
          dataJson.links.forEach(function(l){
              var id = l.from + "\u2192" + l.to;
              linkIds[id] = true;
              edges.update({id: id, from: l.from, to: l.to});
          });
          edges.forEach(function(e) {
              if (!linkIds[e.id]) edges.remove(e.id);
          });
      }

      function handle_msg(dataJson) {
	  var directed = dataJson.info && dataJson.info.includes("(directed)");
	  network.setOptions({edges: {arrows: {to: {enabled: directed}}}});
          update_nodes_from_data(dataJson);
          update_edges_from_data(dataJson);
	  document.getElementById("show").innerHTML = dataJson.info;
      }
      if ("WebSocket" in window) {
	  // 打开一个 web socket
	  ws = new WebSocket("ws://localhost:8081/ws");
	  ws.onopen = function()
	  {
              var el = document.getElementById('connection');
              el.classList.remove('disconnected');
              el.classList.add('connected');
              getRelations();
	  };
	  ws.onmessage = function (evt) {
              var received_msg = evt.data;
              var dataJson = JSON.parse(received_msg);
              handle_msg(dataJson);
	  };

	  ws.onclose = function ()
          {
              var el = document.getElementById('connection');
              el.classList.remove('connected');
              el.classList.add('disconnected');
          }
      }
      else{
          // 浏览器不支持 WebSocket
	  alert("您的浏览器不支持 WebSocket!");
      }      
      setInterval(function(){
          getRelations();
      },1000);

    </script>
  

</body></html>
